# Builds upstream NSSM with the toolchain upstream used. The 2.24-103 release's
# own nssm.exe files were linked by VC++ 2008 SP1 (linker 9.0, Rich header
# build 30729), so this builds the untouched nssm.vcproj with that compiler,
# cl 15.00.30729.01, through vcbuild. The source comes from master (or the ref
# given to a manual run), never from this branch.
name: Build

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build (branch, tag or commit)
        default: master
      release:
        description: Publish the build as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  # The toolchain comes from regulad/vs, a private mirror: its license forbids
  # publishing it (see that repository's README). Every file is pinned here as
  # well as there, so a change to the mirror cannot silently change the
  # compiler, and every installer is also accepted only with a valid Microsoft
  # signature.
  #
  # vc9/VCForPython27.msi: Microsoft Visual C++ Compiler for Python 2.7,
  # VC++ 2008 SP1's compilers (x86, x64 and x86->x64), vcbuild and its project
  # engine, and Windows SDK 7.0's headers, import libraries, rc and mc.
  VC9_SHA256: 070474db76a2e625513a5835df4595df9324d820f9cc97eab2a596dcbc2f5cbf
  # vc9/vcredist_x64.exe: the VC++ 2008 runtime, which vcbuild.exe needs in
  # WinSxS and an administrative extract of the MSI does not install.
  VCREDIST_SHA256: c5e273a4a16ab4d5471e91c7477719a2f45ddadb76c7f98a38fa5074a6838654
  # vc9/VS2008ExpressWithSP1ENUX1504728.iso: VS 2008 Express SP1, the whole
  # image. It is here for VS 2008's VC\VCProjectDefaults, without which
  # vcbuild cannot load a .vcproj and which the compiler package lacks. An
  # image carries no signature; the installers taken out of it do.
  EXPRESS_ISO_SHA256: 6d3b5eedfa461969c5d645871b53002d162a2e238486900d2fdf71774d53fb91
  # What comes out of the image: the 24 project defaults, as SHA-256 of the
  # "<sha256>  <name>" lines, one per file, ordinal-sorted by name and joined
  # with LF. A check on the extraction, which a pinned image makes
  # deterministic.
  VCPD_SHA256: 50513929be84bc5f5a991cace9107b0644a6b1f0d3ccbfcb5b5f46183f4372c1

jobs:
  build:
    runs-on: windows-2025
    outputs:
      name: ${{ steps.layout.outputs.name }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ inputs.ref || 'master' }}
          # version.cmd stamps the build from `git describe --tags --long`.
          fetch-depth: 0
          path: src

      # secrets.PAT, not GITHUB_TOKEN, which cannot read another repository.
      # It needs read access to regulad/vs's contents and nothing else.
      - name: Require the mirror token
        env:
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if ($env:HAS_PAT -ne 'true') {
            Write-Host '::error::secrets.PAT is empty. The toolchain lives in regulad/vs, which is private, so there is nothing to fall back to. Set the PAT repository secret to a token with read access to regulad/vs contents.'
            exit 1
          }

      # Pointers only: with lfs false, checkout leaves each LFS file as its
      # ~130-byte pointer, whose oid is the file's SHA-256. That is what the
      # cache is keyed on, so a runner knows whether its cached copy is current
      # before it downloads anything. Inside the workspace, because hashFiles()
      # matches nothing outside it and would yield a stable, wrong, empty key.
      - name: Check out the toolchain mirror's LFS pointers
        uses: actions/checkout@v5.0.0
        with:
          repository: regulad/vs
          token: ${{ secrets.PAT }}
          path: vs-mirror
          lfs: false

      - name: Check the pointers against the pins
        working-directory: vs-mirror
        run: |
          $pins = @{
            'vc9/VCForPython27.msi' = $env:VC9_SHA256
            'vc9/vcredist_x64.exe' = $env:VCREDIST_SHA256
            'vc9/VS2008ExpressWithSP1ENUX1504728.iso' = $env:EXPRESS_ISO_SHA256
          }
          foreach ($pin in $pins.GetEnumerator()) {
            $text = Get-Content -Raw $pin.Key
            if ($text -notmatch '(?m)^oid sha256:([0-9a-f]{64})\r?$') { throw "$($pin.Key) is not a Git LFS pointer; the mirror's layout changed, or checkout fetched LFS objects" }
            if ($Matches[1] -ne $pin.Value) { throw "$($pin.Key) in regulad/vs is $($Matches[1]), but this workflow pins $($pin.Value)" }
            Write-Host "$($pin.Key): $($Matches[1])"
          }

      - name: Restore the cached toolchain
        id: vc9
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vc9-dl
          key: vc9-${{ hashFiles('vs-mirror/vc9/*') }}

      - name: Fetch the toolchain from the mirror
        if: steps.vc9.outputs.cache-hit != 'true'
        working-directory: vs-mirror
        run: |
          git lfs pull --include 'vc9/*'
          if ($LASTEXITCODE -ne 0) { throw "git lfs pull exited $LASTEXITCODE" }
          $dl = Join-Path $env:RUNNER_TEMP 'vc9-dl'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          # The whole image is cached, not the 24 small files taken from it:
          # the cache entry should not depend on today's extraction list, and
          # LFS bandwidth, not storage, is the cost a cache miss pays.
          Copy-Item vc9\VCForPython27.msi, vc9\vcredist_x64.exe, vc9\VS2008ExpressWithSP1ENUX1504728.iso $dl

      - name: Save the toolchain to the cache
        if: steps.vc9.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vc9-dl
          key: ${{ steps.vc9.outputs.cache-primary-key }}

      - name: Verify and unpack VC++ 2008 SP1
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'vc9-dl'
          # On both paths: a cache entry is only as good as what was saved.
          function Assert-Microsoft([string]$Name, [string]$Sha256) {
            $file = Join-Path $dl $Name
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $Sha256) { throw "$Name is $hash, expected $Sha256" }
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
              throw "$Name is not validly signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
            }
            Write-Host "verified $Name ($hash, $($sig.SignerCertificate.Subject))"
            $file
          }
          $msi = Assert-Microsoft 'VCForPython27.msi' $env:VC9_SHA256
          $redist = Assert-Microsoft 'vcredist_x64.exe' $env:VCREDIST_SHA256
          $iso = Join-Path $dl 'VS2008ExpressWithSP1ENUX1504728.iso'
          $isoHash = (Get-FileHash $iso -Algorithm SHA256).Hash.ToLower()
          if ($isoHash -ne $env:EXPRESS_ISO_SHA256) { throw "VS2008ExpressWithSP1ENUX1504728.iso is $isoHash, expected $env:EXPRESS_ISO_SHA256" }
          Write-Host "verified VS2008ExpressWithSP1ENUX1504728.iso ($isoHash)"

          $p = Start-Process -FilePath $redist -ArgumentList '/q' -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "vcredist_x64.exe exited $($p.ExitCode)" }

          # An administrative extract: the files only, no install.
          $root = Join-Path $env:RUNNER_TEMP 'vc9'
          $p = Start-Process -FilePath msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$root`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a exited $($p.ExitCode)" }
          $vc = Join-Path $root 'Microsoft\Visual C++ for Python\9.0'
          & "$vc\VC\bin\cl.exe" 2>&1 | Select-Object -First 1 | Write-Host
          "VC9=$vc" | Add-Content -Path $env:GITHUB_ENV

      # vcbuild cannot load a .vcproj without VS 2008's system property sheets,
      # and the compiler package has none. They come out of the Express image:
      # VCExpress\Ixpvc.exe unpacks to vs_setup.msi and vs_setup.cab, the cab
      # names each file by its key in the MSI's File table, and the files
      # wanted are those whose component installs to VCProjectDefaults. The
      # package's vcbuild sits in VC\bin\amd64, so it takes $(VCInstallDir) to
      # be VC\bin\ and looks for them in VC\bin\VCProjectDefaults.
      - name: Extract VS 2008's project defaults from the Express image
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'vc9-dl\VS2008ExpressWithSP1ENUX1504728.iso'
          $work = Join-Path $env:RUNNER_TEMP 'vcexpress'
          $dest = "$env:VC9\VC\bin\VCProjectDefaults"

          function Assert-MicrosoftSigned([string]$File) {
            $sig = Get-AuthenticodeSignature $File
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
              throw "$File is not validly signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
            }
          }

          New-Item -ItemType Directory -Force -Path $work | Out-Null
          7z e -y -bso0 -bsp0 "-o$work" $iso 'VCExpress/Ixpvc.exe'
          if ($LASTEXITCODE -ne 0) { throw "7z could not take VCExpress\Ixpvc.exe out of the image ($LASTEXITCODE)" }
          7z x -y -bso0 -bsp0 "-o$work\ixpvc" "$work\Ixpvc.exe"
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack Ixpvc.exe ($LASTEXITCODE)" }
          $msi = "$work\ixpvc\vs_setup.msi"
          $cab = "$work\ixpvc\vs_setup.cab"
          foreach ($f in "$work\Ixpvc.exe", $msi, $cab) { Assert-MicrosoftSigned $f }

          # The Windows Installer COM object, driven from Windows PowerShell 5.1
          # with plain-text output so nothing but the rows comes back.
          $query = Join-Path $work 'vcprojectdefaults.ps1'
          Set-Content -Path $query -Value @'
          param([string]$Msi)
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.OpenDatabase($Msi, 0)
          function Rows([string]$Sql) { $v = $db.OpenView($Sql); [void]$v.Execute(); while ($r = $v.Fetch()) { ,$r } }
          $dirName = @{}; foreach ($r in Rows 'SELECT Directory, DefaultDir FROM Directory') { $dirName[$r.StringData(1)] = (($r.StringData(2) -split ':')[-1] -split '\|')[-1] }
          $dirOf = @{}; foreach ($r in Rows 'SELECT Component, Directory_ FROM Component') { $dirOf[$r.StringData(1)] = $r.StringData(2) }
          foreach ($r in Rows 'SELECT File, Component_, FileName, FileSize FROM File') {
            if ($dirName[$dirOf[$r.StringData(2)]] -eq 'VCProjectDefaults') {
              '{0}|{1}|{2}' -f $r.StringData(1), ($r.StringData(3) -split '\|')[-1], $r.IntegerData(4)
            }
          }
          '@
          $rows = @(powershell.exe -NoProfile -NonInteractive -OutputFormat Text -File $query -Msi $msi)
          if ($LASTEXITCODE -ne 0) { throw "reading vs_setup.msi's tables failed ($LASTEXITCODE)" }
          $files = @($rows | Where-Object { $_ -match '^[^|]+\|[^|]+\|\d+$' } | ForEach-Object { $k, $n, $s = $_ -split '\|'; [pscustomobject]@{ Key = $k; Name = $n; Size = [long]$s } })
          if ($files.Count -eq 0) { throw "vs_setup.msi lists no files under VCProjectDefaults:`n$($rows -join "`n")" }

          $raw = Join-Path $work 'cab'
          7z e -y -bso0 -bsp0 "-o$raw" $cab @($files.Key)
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract the project defaults from vs_setup.cab ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($f in $files) {
            $src = Join-Path $raw $f.Key
            if (-not (Test-Path $src)) { throw "vs_setup.cab has no $($f.Key) ($($f.Name))" }
            if ((Get-Item $src).Length -ne $f.Size) { throw "$($f.Name) is $((Get-Item $src).Length) bytes, vs_setup.msi says $($f.Size)" }
            Copy-Item $src (Join-Path $dest $f.Name)
          }

          $names = [string[]](Get-ChildItem $dest -File | ForEach-Object Name)
          [Array]::Sort($names, [StringComparer]::Ordinal)
          $listing = ($names | ForEach-Object { '{0}  {1}' -f (Get-FileHash (Join-Path $dest $_) -Algorithm SHA256).Hash.ToLower(), $_ }) -join "`n"
          $digest = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($listing))).Replace('-', '').ToLower()
          if ($digest -ne $env:VCPD_SHA256) { throw "the $($names.Count) extracted project defaults digest to $digest, expected $env:VCPD_SHA256" }
          Write-Host "installed $($names.Count) project defaults in $dest ($digest)"

      - name: Build Release for Win32 and x64
        working-directory: src
        run: |
          $vc = $env:VC9
          # vcbuild ships only as an x64 binary; /useenv makes it take the
          # compilers, headers and libraries from the environment set here
          # rather than from a Visual Studio install's registry settings.
          $vcbuild = "$vc\VC\bin\amd64\vcbuild.exe"
          $toolchains = [ordered]@{
            Win32 = @{ Bin = "$vc\VC\bin;$vc\WinSDK\Bin"; Lib = "$vc\VC\lib;$vc\WinSDK\Lib" }
            x64   = @{ Bin = "$vc\VC\bin\amd64;$vc\WinSDK\Bin\x64;$vc\WinSDK\Bin"; Lib = "$vc\VC\lib\amd64;$vc\WinSDK\Lib\x64" }
          }
          $basePath = $env:PATH
          foreach ($platform in $toolchains.Keys) {
            $env:PATH = "$($toolchains[$platform].Bin);$basePath"
            $env:INCLUDE = "$vc\VC\include;$vc\WinSDK\Include"
            $env:LIB = $toolchains[$platform].Lib
            $env:LIBPATH = $toolchains[$platform].Lib
            Write-Host "::group::Release|$platform"
            & $vcbuild /nologo /useenv nssm.vcproj "Release|$platform"
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { throw "vcbuild Release|$platform exited $code" }
          }

      - name: Check the binaries
        working-directory: src
        run: |
          $describe = git describe --tags --long
          Write-Host "source: $describe"
          foreach ($arch in @{ win32 = 0x014c; win64 = 0x8664 }.GetEnumerator()) {
            $exe = "out\Release\$($arch.Key)\nssm.exe"
            $b = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $pe = [BitConverter]::ToInt32($b, 0x3c)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            $linker = '{0}.{1}' -f $b[$pe + 26], $b[$pe + 27]
            $version = (Get-Item $exe).VersionInfo.FileVersion
            Write-Host ("{0}: machine 0x{1:x4}, linker {2}, FileVersion {3}" -f $exe, $machine, $linker, $version)
            if ($machine -ne $arch.Value) { throw "$exe is not a $($arch.Key) binary" }
            if ($linker -ne '9.0') { throw "$exe was not linked by VC++ 2008" }
          }

      # nssm-<describe>\ with win32\ and win64\ (nssm.exe, nssm.pdb), src\ (the
      # source tree but for the two text files, which sit at the top) and
      # README.txt and ChangeLog.txt: the shape of upstream's own zips, so the
      # Scoop manifest's extract_dir is the one it always was.
      - name: Lay out the artifact like upstream's release zip
        id: layout
        working-directory: src
        run: |
          $name = 'nssm-' + ((git describe --tags --long) -replace '^v', '')
          $dest = Join-Path $env:RUNNER_TEMP "artifact\$name"
          foreach ($arch in 'win32', 'win64') {
            New-Item -ItemType Directory -Force -Path "$dest\$arch" | Out-Null
            Copy-Item "out\Release\$arch\nssm.exe", "out\Release\$arch\nssm.pdb" "$dest\$arch\"
          }
          Copy-Item README.txt, ChangeLog.txt $dest
          $srcZip = Join-Path $env:RUNNER_TEMP 'src.zip'
          git archive --format=zip -o $srcZip HEAD -- . ':(exclude)README.txt' ':(exclude)ChangeLog.txt'
          if ($LASTEXITCODE -ne 0) { throw "git archive exited $LASTEXITCODE" }
          Expand-Archive -Path $srcZip -DestinationPath "$dest\src"
          Write-Host "${name}: $((Get-ChildItem $dest -Recurse -File).Count) files"
          "ARTIFACT_DIR=$(Split-Path $dest)" | Add-Content -Path $env:GITHUB_ENV
          "name=$name" | Add-Content -Path $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.layout.outputs.name }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error

  # Only on a manual run with `release` ticked. The tag is the zip's name,
  # nssm-<describe>, and it goes on this pipeline's commit (GITHUB_SHA), never
  # on the source: a tag on master would become the nearest tag `git describe`
  # finds there, and version.cmd would stamp every later build with it. A tag
  # that already exists makes `gh release create` fail rather than replace a
  # published release. The .sha256 sidecar is what the regulad bucket's
  # autoupdate reads.
  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NAME: ${{ needs.build.outputs.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: artifact

      - name: Package and release
        shell: bash
        run: |
          set -eu
          (cd artifact && zip -q -r -X "../$NAME.zip" "$NAME")
          hash=$(sha256sum "$NAME.zip" | cut -d' ' -f1)
          printf '%s  %s' "$hash" "$NAME.zip" > "$NAME.zip.sha256"
          echo "$NAME.zip: $(stat -c %s "$NAME.zip") bytes, sha256 $hash"
          version=${NAME#nssm-}
          notes=$(cat <<EOF
          Upstream NSSM ${version}, built from the untouched source at [\`${version##*-g}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${version##*-g}) with the toolchain upstream used: VC++ 2008 SP1 (\`cl\` 15.00.30729.01), through \`vcbuild\` and the original \`nssm.vcproj\`. Laid out like upstream's own zip: \`win32\`, \`win64\` (each \`nssm.exe\` and \`nssm.pdb\`), \`src\`, \`README.txt\` and \`ChangeLog.txt\`. The x64 build runs under emulation on Windows on Arm.

          SHA-256: \`${hash}\`

          Built by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) at [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Upstream: https://nssm.cc/
          EOF
          )
          gh release create "$NAME" "$NAME.zip" "$NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NSSM $version" \
            --notes "$notes"
